name: Prepare verified Divas video v43
on:
  push:
    branches: [codex/transport-divas-video-v43]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: f151b6b04f415531b504e9a98e1cac2ba6684f08
          path: release
      - run: python3 transfer/.codex-upload/apply-release.py release
